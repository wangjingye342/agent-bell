# 云端构建两个平台的安装包：
#   · windows  → AgentBellBridge-Setup.exe（PyInstaller + Inno Setup）
#   · macos    → AgentBellBridge-mac-applesilicon.dmg / -intel.dmg
# 触发：Actions 页面手动 Run workflow，或打 v* 标签。
# 产物在 run 页面的 Artifacts 区下载。
name: build-installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/agent-bell-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 装依赖
        run: >
          python -m pip install pyinstaller pywebview pythonnet pystray pillow
          winrt-runtime winrt-Windows.Foundation winrt-Windows.Foundation.Collections
          winrt-Windows.UI.Notifications winrt-Windows.UI.Notifications.Management
          winrt-Windows.ApplicationModel
      - name: PyInstaller
        run: >
          python -m PyInstaller pack/AgentBellBridge.spec --noconfirm
          --distpath pack/dist --workpath pack/build
      - name: 给 Inno 补中文语言包
        shell: pwsh
        run: |
          $dst = "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl" -OutFile $dst
      - name: Inno Setup 出安装器
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" pack\AgentBellBridge.iss
      - uses: actions/upload-artifact@v4
        with:
          name: AgentBellBridge-Setup-windows
          path: tools/agent-bell-bridge/pack/Output/AgentBellBridge-Setup.exe
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14          # Apple 芯片（M 系列）
            tag: applesilicon
          - runner: macos-13          # Intel（跑道若被 GitHub 下线不影响其它任务）
            tag: intel
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.tag == 'intel' }}
    defaults:
      run:
        working-directory: tools/agent-bell-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 构建 .app + DMG
        run: bash pack/build_mac.sh ${{ matrix.tag }}
      - uses: actions/upload-artifact@v4
        with:
          name: AgentBellBridge-mac-${{ matrix.tag }}
          path: tools/agent-bell-bridge/pack/Output/*.dmg
          if-no-files-found: error
